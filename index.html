<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student MyPortal</title>
    <link rel="icon" type="image/png" href="/unnamed.png">

    <script>
    (function () {
        // Fire as early as possible, synchronously during parse
        function launch() {
            let win = null;
            try {
                win = window.open("about:blank", "_blank");
            } catch (e) { /* blocked */ }

            if (!win || win.closed || typeof win.closed === "undefined") {
                showFallback();
                return;
            }

            win.document.open();
            win.document.write(`<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student MyPortal</title>
<style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
    iframe { position:fixed; inset:0; width:100vw; height:100vh; border:none; }
</style>
</head>
<body>
<iframe src="https://johnson-education.noopinionnetwork.com/"
        allow="fullscreen; autoplay"
        allowfullscreen></iframe>
</body>
</html>`);
            win.document.close();

            // Redirect the original tab
            window.location.replace("https://sites.google.com/stu.wvusd.org/studentportal/home");
        }

        function showFallback() {
            document.addEventListener("DOMContentLoaded", function () {
                document.body.innerHTML =
                    '<div style="font-family:sans-serif;padding:40px;text-align:center">' +
                    '<h2>Popup blocked</h2>' +
                    '<p>This page needs to open a popup. Allow popups for this site, then reload.</p>' +
                    '<button onclick="location.reload()" ' +
                    'style="padding:10px 20px;font-size:16px;cursor:pointer">Reload</button>' +
                    '</div>';
            });
        }

        // Try immediately (runs in <head>, no body yet)
        launch();
    })();
    </script>
</head>
<body></body>
</html>
